# Evaluation matrix: which (task, regime, variant) cells make up a full run.
# run_matrix.py iterates this x the enabled models in models.yaml.
# Every cell is resumable via the response cache, so re-running is free.

cells:
  # -- MCQ (headline: mcq4 subset) -----------------------------------------
  - {task: mcq, regime: zero_shot, mcq_subset: mcq4}
  - {task: mcq, regime: five_shot, mcq_subset: mcq4}
  - {task: mcq, regime: cot,       mcq_subset: mcq4}
  # choice-permuted variant: run zero_shot + cot to measure position bias
  - {task: mcq, regime: zero_shot, mcq_subset: mcq4, permuted: true}
  - {task: mcq, regime: cot,       mcq_subset: mcq4, permuted: true}
  # secondary MCQ formats, zero-shot only (reported separately)
  - {task: mcq, regime: zero_shot, mcq_subset: all}

  # -- MT (both directions, both regimes) --------------------------------
  - {task: mt, regime: zero_shot, direction: en2mz}
  - {task: mt, regime: zero_shot, direction: mz2en}
  - {task: mt, regime: five_shot, direction: en2mz}
  - {task: mt, regime: five_shot, direction: mz2en}

  # -- sentiment --------------------------------------------------------
  - {task: sentiment, regime: zero_shot}
  - {task: sentiment, regime: five_shot}

  # -- NER (official split + document-disjoint re-split) --------------
  - {task: ner, regime: few_shot, ner_split: test}
  - {task: ner, regime: few_shot, ner_split: test, docsplit: true}

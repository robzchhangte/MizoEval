[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizoeval"
version = "0.1.0"
description = "A multi-task LLM evaluation benchmark for Mizo (lus)"
requires-python = ">=3.10"
dependencies = [
    "datasets>=3.0",
    "huggingface_hub>=0.30",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "sacrebleu>=2.4",
    "seqeval>=1.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
providers = ["openai>=1.40", "anthropic>=0.40", "google-genai>=1.0"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
